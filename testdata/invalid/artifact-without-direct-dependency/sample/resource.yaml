resource:
  version: "v1.0.0"
  id: sample
  name: Test resource
workflows:
  main:
    jobs:
      build:
        sandbox-image: ghcr.io/example/default:latest
        limits:
          memory: 64MiB
          step-timeout: 1s
        steps:
        - run: 'true'
        artifacts:
          outputs:
          - name: program
            path: program
      check:
        sandbox-image: ghcr.io/example/default:latest
        limits:
          memory: 64MiB
          step-timeout: 1s
        steps:
        - run: 'true'
        depends: []
        artifacts:
          inputs:
          - from-job: build
            name: program
            path: program
