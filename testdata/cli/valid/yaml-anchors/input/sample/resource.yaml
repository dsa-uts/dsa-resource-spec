resource:
  version: "v1.0.0"
  id: sample
  name: Test resource
workflows:
  main:
    jobs:
      build:
        sandbox-image: &image ghcr.io/example/default:latest
        limits:
          memory: 64MiB
          step-timeout: 1s
        steps:
        - run: touch program
          compile: true
        artifacts:
          outputs:
          - name: program
            path: program
      public:
        sandbox-image: *image
        limits:
          memory: 64MiB
          step-timeout: 1s
        steps:
        - run: echo hello
          expected:
            stdout:
              match: exact
              path: expected.txt
        - run: 'true'
        depends:
        - build
        artifacts:
          inputs:
          - from-job: build
            name: program
            path: program
      private:
        visibility: private
        sandbox-image: *image
        limits:
          memory: 64MiB
          step-timeout: 1s
        steps:
        - run: 'true'
        depends:
        - build
        artifacts:
          inputs:
          - from-job: build
            name: program
            path: program
    description-path: description.md
