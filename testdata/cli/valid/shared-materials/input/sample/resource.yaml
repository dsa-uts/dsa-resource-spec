resource:
  version: "v1.0.0"
  id: sample
  name: Test resource
workflows:
  main:
    jobs:
      build:
        sandbox-image: ghcr.io/example/default:latest
        limits:
          memory: 64MiB
          step-timeout: 1s
        steps:
        - run: touch program
          compile: true
        visibility: public
        artifacts:
          outputs:
          - name: program
            path: program
      public:
        sandbox-image: ghcr.io/example/default:latest
        limits:
          memory: 64MiB
          step-timeout: 1s
        steps:
        - run: echo hello
          stdin: {path: ../shared/.hidden/input.bin}
          expected:
            stdout:
              match: exact
              value: ''
        - run: 'true'
        visibility: public
        depends:
        - build
        artifacts:
          inputs:
          - from-job: build
            name: program
            path: program
      private:
        visibility: private
        sandbox-image: ghcr.io/example/default:latest
        limits:
          memory: 64MiB
          step-timeout: 1s
        steps:
        - run: 'true'
        depends:
        - build
        artifacts:
          inputs:
          - from-job: build
            name: program
            path: program
    description-path: link/../description.md
    presets:
      files:
        - source: ../shared/link
          path: tools/program
        - source: ../shared/.hidden/input.bin
          path: input.bin
