name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Test publication scripts
        run: |
          go build -o "$RUNNER_TEMP/resource-spec" ./cmd/resource-spec
          RESOURCE_SPEC="$RUNNER_TEMP/resource-spec" python3 -B -m unittest discover -s tests -v
