name: Resources
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['release/**']
  workflow_dispatch:
permissions:
  contents: read
# Keep the lock from image build through tag resolution and the release commit.
# PR validation has a separate queue and never holds up publication.
concurrency:
  group: resources-${{ github.event_name == 'pull_request' && github.ref || 'publish-main' }}
  cancel-in-progress: false
  queue: max
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build Resource CI CLI
        run: |
          mkdir -p "$RUNNER_TEMP/resource-bin"
          go build -o "$RUNNER_TEMP/resource-bin/resource-ci" ./cmd/resource-ci
          echo "$RUNNER_TEMP/resource-bin" >> "$GITHUB_PATH"
      - name: Validate resources
        run: resource-ci check
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      # Use the triggering snapshot even if main has advanced while queued.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build publication tools
        run: |
          mkdir -p "$RUNNER_TEMP/resource-bin"
          go build -o "$RUNNER_TEMP/resource-bin/resource-ci" ./cmd/resource-ci
          GOBIN="$RUNNER_TEMP/resource-bin" go install github.com/regclient/regclient/cmd/regctl@v0.8.3
          echo "$RUNNER_TEMP/resource-bin" >> "$GITHUB_PATH"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: Build and publish sandbox images
        run: resource-ci build-images --gha-cache
      - name: Publish resource snapshots
        run: resource-ci publish
