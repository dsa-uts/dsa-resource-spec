name: Resources
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Build Resource CLI
        run: |
          mkdir -p "$RUNNER_TEMP/resource-bin"
          go build -o "$RUNNER_TEMP/resource-bin/resource-spec" ./cmd/resource-spec
          echo "$RUNNER_TEMP/resource-bin" >> "$GITHUB_PATH"
      - run: resource-spec validate .
  build-images:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: resource-images-main
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Build Resource CLI
        run: |
          mkdir -p "$RUNNER_TEMP/resource-bin"
          go build -o "$RUNNER_TEMP/resource-bin/resource-spec" ./cmd/resource-spec
          echo "$RUNNER_TEMP/resource-bin" >> "$GITHUB_PATH"
      - run: resource-spec validate .
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: Build and push sandbox images
        run: python3 scripts/build_images.py
