name: Resources
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['release/**']
  workflow_dispatch:
permissions:
  contents: read
# Keep the lock from image build through tag resolution and the release commit.
# PR validation has a separate queue and never holds up publication.
concurrency:
  group: resources-${{ github.event_name == 'pull_request' && github.ref || 'publish-main' }}
  cancel-in-progress: false
  queue: max
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build Resource CLI
        run: |
          mkdir -p "$RUNNER_TEMP/resource-bin"
          go build -o "$RUNNER_TEMP/resource-bin/resource-spec" ./cmd/resource-spec
          echo "$RUNNER_TEMP/resource-bin" >> "$GITHUB_PATH"
      - name: Validate resources and version changes
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          resource-spec validate .
          base="${PR_BASE:-$PUSH_BASE}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          python3 scripts/check_resources.py --base "$base"
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      # Use the triggering snapshot even if main has advanced while queued.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build publication tools
        run: |
          mkdir -p "$RUNNER_TEMP/resource-bin"
          go build -o "$RUNNER_TEMP/resource-bin/resource-spec" ./cmd/resource-spec
          GOBIN="$RUNNER_TEMP/resource-bin" go install github.com/regclient/regclient/cmd/regctl@v0.8.3
          echo "$RUNNER_TEMP/resource-bin" >> "$GITHUB_PATH"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: Build and publish sandbox images
        run: python3 scripts/build_images.py --gha-cache
      - name: Publish resource snapshots
        run: python3 scripts/publish_resources.py
