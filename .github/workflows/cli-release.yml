name: CLI Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example, v1.0.0)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cli-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo 'Expected a stable version tag such as v1.0.0' >&2
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test tagged source
        run: |
          go vet ./...
          go test ./...
      - name: Build archives and checksums
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            staging="$RUNNER_TEMP/resource-cli-$GOOS-$GOARCH"
            mkdir -p "$staging"
            go build -trimpath -o "$staging/resource-spec" ./cmd/resource-spec
            go build -trimpath -o "$staging/resource-ci" ./cmd/resource-ci
            cp LICENSE "$staging/"
            tar -czf "dist/resource-cli-${TAG}-${GOOS}-${GOARCH}.tar.gz" \
              -C "$staging" resource-spec resource-ci LICENSE
          done
          cd dist
          sha256sum ./*.tar.gz > checksums.txt
          sha256sum --check checksums.txt
      - name: Publish CLI release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$TAG" dist/*.tar.gz dist/checksums.txt --verify-tag --generate-notes --title "$TAG"
